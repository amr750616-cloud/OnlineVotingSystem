<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            background: #1769e0;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Admin Login</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>Demo Username: <b>admin</b></p>
    <p>Demo Password: <b>admin123</b></p>

    <a href="{{ url_for('index') }}">
        ← Back to Home
    </a>

</div>

</body>
</html>
